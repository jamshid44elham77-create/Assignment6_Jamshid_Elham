    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            color: #172033;
            background: #eef3f8;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(500px, calc(100% - 40px));
            padding: 40px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);
            text-align: center;
        }

        .links {
            display: grid;
            gap: 14px;
            margin-top: 28px;
        }

        a {
            padding: 14px;
            border-radius: 10px;
            color: white;
            background: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
